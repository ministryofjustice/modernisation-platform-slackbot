api:
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "2Gi"

slackbot:
  replicas: 1
  environment: development
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "512Mi"

ingress:
  domain: apps.live.cloud-platform.service.justice.gov.uk
  pathType: ImplementationSpecific
  awsWeight: "100"

securityContext:
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true