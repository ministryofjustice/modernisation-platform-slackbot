apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    external-dns.alpha.kubernetes.io/set-identifier: {{ .Values.ingressIdentifier }}
    external-dns.alpha.kubernetes.io/aws-weight: "{{ .Values.ingress.awsWeight }}"
spec:
  tls:
    - hosts:
        - {{ .Values.namespace }}.{{ .Values.ingress.domain }}
  rules:
    - host: {{ .Values.namespace }}.{{ .Values.ingress.domain }}
      http:
        paths:
          - path: /
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: api
                port:
                  number: 3001
