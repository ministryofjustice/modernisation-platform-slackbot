name: Test Dockerfile
on: pull_request

jobs:
  dockerfile-test:
    name: container-structure-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Build
        run: docker build -t api-test api/
      - name: Check it exists
        run: docker images

      - name: Run docker tests
        uses: docker://gcr.io/gcp-runtimes/container-structure-test@sha256:1ad62d510afe4c326153cf4a9f2e52036dd28cb0893278263b3245e87b78d570 # latest
        with:
          args: "test --image api-test --config api/docker-test.yaml"
