name: Build and Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      development_branch:
        description: Branch to deploy to development
        required: false
        type: string
        default: main

jobs:
  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ">=1.25.0"

      - name: Install gofumpt
        working-directory: api
        run: |
          go install mvdan.cc/gofumpt@latest

      - name: Run gofumpt command
        working-directory: api
        run: |
          "$(go env GOPATH)/bin/gofumpt" -l -d ./

      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: latest
          working-directory: api

  go-test:
    name: go-test (${{ matrix.os }})
    needs: staticcheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ">=1.25.0"

      - name: Run tests
        working-directory: api
        run: |
          set -euo pipefail
          go test -json -race -covermode=atomic -coverprofile=coverage.out -v ./... 2>&1 | tee ~/gotest.log

      - name: Upload test log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-log-${{ matrix.os }}
          path: ~/gotest.log
          if-no-files-found: error
          overwrite: true

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: api/coverage.out

  deploy-development:
    name: Deploy development
    needs: [go-test, staticcheck]
    strategy:
      fail-fast: false
      matrix:
        include:
          - checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.development_branch || github.ref }}
    uses: ./.github/workflows/reusable-build-and-deploy.yaml
    with:
      environment: development
      cluster: live
      ingress_colour: green
      aws_region: eu-west-2
      image_tag: latest
      slackbot_image_tag: slackbot_latest
      checkout_ref: ${{ matrix.checkout_ref }}
    secrets: inherit

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: deploy-development
    name: Deploy production
    uses: ./.github/workflows/reusable-build-and-deploy.yaml
    with:
      environment: production
      cluster: live
      ingress_colour: blue
      aws_region: eu-west-2
      image_tag: latest
      slackbot_image_tag: slackbot_latest
      checkout_ref: main
    secrets: inherit
