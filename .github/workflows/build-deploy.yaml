---
name: Build and Deploy

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      development_branch:
        description: Branch to deploy to development
        required: false
        type: string
        default: main

permissions: {}

jobs:
  staticcheck:
    name: staticcheck
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ">=1.27.3"

      - name: Install gofumpt
        working-directory: api
        run: |
          go install mvdan.cc/gofumpt@latest

      - name: Run gofumpt command
        working-directory: api
        run: |
          "$(go env GOPATH)/bin/gofumpt" -l -d ./

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          working-directory: api

  go-test:
    name: go-test (${{ matrix.os }})
    permissions:
      contents: read
    needs: staticcheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ">=1.27.3"

      - name: Run tests
        working-directory: api
        run: |
          set -euo pipefail
          go test -json -race -covermode=atomic -coverprofile=coverage.out -v ./... 2>&1 | tee ~/gotest.log

      - name: Upload test log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-log-${{ matrix.os }}
          path: ~/gotest.log
          if-no-files-found: error
          overwrite: true

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: api/coverage.out

  deploy-development:
    name: Deploy development
    permissions:
      contents: read
      id-token: write
    needs: [go-test, staticcheck]
    strategy:
      fail-fast: false
      matrix:
        include:
          - checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.development_branch || github.ref }}
    uses: ./.github/workflows/reusable-build-and-deploy.yaml
    with:
      environment: development
      cluster: live
      ingress_colour: green
      aws_region: eu-west-2
      image_tag: latest
      slackbot_image_tag: slackbot_latest
      checkout_ref: ${{ matrix.checkout_ref }}
    secrets:
      ECR_ROLE_TO_ASSUME: ${{ secrets.ECR_ROLE_TO_ASSUME }}
      KUBE_CERT: ${{ secrets.KUBE_CERT }}
      KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
      KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
      KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}

  deploy-production:
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/main'
    needs: deploy-development
    name: Deploy production
    uses: ./.github/workflows/reusable-build-and-deploy.yaml
    with:
      environment: production
      cluster: live
      ingress_colour: blue
      aws_region: eu-west-2
      image_tag: latest
      slackbot_image_tag: slackbot_latest
      checkout_ref: main
    secrets:
      ECR_ROLE_TO_ASSUME: ${{ secrets.ECR_ROLE_TO_ASSUME }}
      KUBE_CERT: ${{ secrets.KUBE_CERT }}
      KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
      KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
      KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
